name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  RUBY_VERSION: 3.4.3
  NODE_VERSION: 20
  REGISTRY: ghcr.io
  IMAGE_NAME: makarenkoj/simple_blog

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Run Rubocop
        run: |
          bundle exec rubocop --parallel --format progress

      - name: Check for security issues
        run: |
          gem install brakeman
          brakeman --no-pager
        continue-on-error: true

  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4.3']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: helpbooost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install system dependencies for ActiveStorage
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips imagemagick libvips-tools

      - name: Cache assets
        uses: actions/cache@v4
        with:
          path: |
            public/assets
            public/packs
            tmp/cache/assets
          key: ${{ runner.os }}-assets-${{ hashFiles('**/package.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-assets-

      - name: Install dependencies
        run: |
          bundle install --jobs 4 --retry 3
          yarn install --frozen-lockfile

      - name: Setup database
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/helpbooost_test
        run: |
          bin/rails db:create db:schema:load

      - name: Precompile assets (test)
        env:
          RAILS_ENV: test
          SECRET_KEY_BASE: test
        run: bin/rails assets:precompile

      - name: Run RSpec
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/helpbooost_test
          COVERAGE: true
        run: |
          bundle exec rspec --format documentation --color

      - name: Upload coverage to Codecov
        if: matrix.ruby == '3.4.3'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage.json
          fail_ci_if_error: falseAdobe Firefly

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, test]

    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    environment:
      name: production
      url: https://helpbooost.com

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install Kamal
        run: gem install kamal

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 400 ~/.ssh/config

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
          FIREBASE_CREDENTIALS_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}
          FCM_TOKEN: ${{ secrets.FCM_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QUEUE_DATABASE_URL: ${{ secrets.QUEUE_DATABASE_URL }}
          CACHE_DATABASE_URL: ${{ secrets.CACHE_DATABASE_URL }}
          CABLE_DATABASE_URL: ${{ secrets.CABLE_DATABASE_URL }}
        run: |
          # kamal proxy reboot -y
          kamal deploy
          # kamal app exec 'bin/rails db:migrate'
          kamal app exec 'bin/rails db:prepare'
          # kamal app exec 'bin/rails sitemap:create'

      - name: Verify deployment
        run: |
          sleep 10
          curl -f https://helpbooost.com || exit 1

      - name: Create deployment summary
        run: |
          echo "## ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** http://206.189.107.151" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date)" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ needs.deploy.result == 'success' && '✅ HelpBooost: Деплой УСПІШНИЙ!' || '❌ HelpBooost: ПОМИЛКА деплою!' }}

            Статус: ${{ job.status }}
            Автор: ${{ github.actor }}
            Коміт: ${{ github.sha }}

            Деталі тут: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
