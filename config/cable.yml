# The async adapter only delivers within one process. Notifications are broadcast from
# background jobs (job container) to browsers connected to the web container, so production
# relays them through the `cable` database with Solid Cable (SAM1-25).
development:
  adapter: async

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
