service: helpbooost

image: makarenkoj/simple_blog

servers:
  web:
    - 206.189.107.151

proxy:
  ssl: true
  hosts:
    - helpbooost.com
    - www.helpbooost.com

registry:
  server: ghcr.io
  username: makarenkoj
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy

builder:
  arch: amd64
  local: false
  remote: ssh://deploy@206.189.107.151

env:
  clear:
    RAILS_ENV: production
    DB_HOST: helpbooost-db
    RAILS_SERVE_STATIC_FILES: true
    RAILS_LOG_TO_STDOUT: true

    GMAIL_USERNAME: help.booost@gmail.com
    DOMAIN_NAME: helpbooost.com
    PROD_DOMAIN_NAME: helpbooost.com
    ADMIN_EMAIL: help.booost@gmail.com
    DEFAULT_HOST: helpbooost.com #206.189.107.151

    R2_BUCKET_NAME: help-boost
    R2_ENDPOINT: https://7c6c19a404b012f7db489c6a0ea46e23.r2.cloudflarestorage.com

    AVO_EMAIL: makarenkoj53@gmail.com
    AVO_LICENSE_KEY: community
    FIREBASE_PROJECT_ID: helpbooost-b1905
    FIREBASE_CLIENT_EMAIL: firebase-adminsdk-fbsvc@helpbooost-b1905.iam.gserviceaccount.com
    CLIENT_ID: 115265296648281310210

  secret:
    - KAMAL_REGISTRY_PASSWORD
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - GMAIL_PASSWORD
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_PUB_DEV_URL
    - FIREBASE_PRIVATE_KEY
    - FIREBASE_PRIVATE_KEY_ID
    - FIREBASE_CREDENTIALS_BASE64
    - FCM_TOKEN
    - DATABASE_URL
    - QUEUE_DATABASE_URL
    - CACHE_DATABASE_URL
    - CABLE_DATABASE_URL

accessories:
  db:
    image: postgres:15
    host: 206.189.107.151
    port: 5432
    env:
      clear:
        POSTGRES_USER: helpbooost
        POSTGRES_DB: helpbooost_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
