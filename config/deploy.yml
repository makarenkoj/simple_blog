service: helpbooost

image: makarenkoj/simple_blog

servers:
  web:
    - 206.189.107.151
  job:
    hosts:
      - 206.189.107.151
    cmd: bin/jobs

proxy:
  ssl: true
  hosts:
    - helpbooost.com
    - www.helpbooost.com

registry:
  server: ghcr.io
  username: makarenkoj
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy

# Pooled SSH connections sit idle during long steps and get dropped by the server. Reconnect
# instead of reusing them (Kamal's default is 900s).
sshkit:
  pool_idle_timeout: 60

# The app boots twice on start (db:migrate in entrypoint.sh, then the server) on a 1 vCPU
# droplet, so booting can take well over the default 30s. Give the new container more time
# before kamal-proxy gives up on it.
deploy_timeout: 120

# Build on the CI runner (4 vCPU) instead of the 1 vCPU droplet, which was slow and filled its
# disk with build cache. Layers are cached in the registry so unchanged steps are reused.
builder:
  arch: amd64
  cache:
    type: registry
    options: mode=max

env:
  clear:
    RAILS_ENV: production
    DB_HOST: helpbooost-db
    RAILS_SERVE_STATIC_FILES: true
    RAILS_LOG_TO_STDOUT: true

    GMAIL_USERNAME: help.booost@gmail.com
    DOMAIN_NAME: helpbooost.com
    PROD_DOMAIN_NAME: helpbooost.com
    ADMIN_EMAIL: help.booost@gmail.com
    DEFAULT_HOST: helpbooost.com #206.189.107.151

    R2_BUCKET_NAME: help-boost
    R2_ENDPOINT: https://7c6c19a404b012f7db489c6a0ea46e23.r2.cloudflarestorage.com

    AVO_LICENSE_KEY: community
    FIREBASE_PROJECT_ID: helpbooost-b1905
    FIREBASE_CLIENT_EMAIL: firebase-adminsdk-fbsvc@helpbooost-b1905.iam.gserviceaccount.com
    CLIENT_ID: 115265296648281310210

  secret:
    - KAMAL_REGISTRY_PASSWORD
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - GMAIL_PASSWORD
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_PUB_DEV_URL
    - FIREBASE_PRIVATE_KEY
    - FIREBASE_PRIVATE_KEY_ID
    - FIREBASE_CREDENTIALS_BASE64
    - FCM_TOKEN
    - DATABASE_URL
    - QUEUE_DATABASE_URL
    - CACHE_DATABASE_URL
    - CABLE_DATABASE_URL
    - SENTRY_DSN

accessories:
  db:
    image: postgres:15
    host: 206.189.107.151
    # Published on the host's loopback only. The app reaches Postgres over the kamal Docker
    # network (DB_HOST=helpbooost-db); with plain `5432` the port was open to the internet
    # (SAM1-30). Connect from outside through an SSH tunnel; see
    # docs/runbooks/close-db-port-and-rotate-db-password.md.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: helpbooost
        POSTGRES_DB: helpbooost_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
