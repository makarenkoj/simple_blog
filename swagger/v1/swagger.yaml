---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/categories":
    get:
      summary: Get a list of categories
      tags:
      - Categories
      security:
      - bearerAuth: []
      responses:
        '200':
          description: successfully returns a list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                  required:
                  - id
                  - name
        '401':
          description: Unauthorized access
  "/api/v1/posts":
    post:
      summary: Create a new article
      tags:
      - Posts
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: The article was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  post:
                    type: object
        '422':
          description: Validation error (invalid data)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
        '401':
          description: Unauthorized access
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - post[title]
              properties:
                post[title]:
                  type: string
                  minLength: 3
                  maxLength: 100
                post[body_html]:
                  type: string
                  description: Post body as HTML. Required unless post[body_markdown]
                    is sent; when both are sent, this one is used.
                post[body_markdown]:
                  type: string
                  description: Post body as GitHub-flavoured Markdown (tables, fenced
                    code with a language). Converted to HTML only when post[body_html]
                    is blank; raw HTML inside is dropped.
                post[status]:
                  type: string
                  enum:
                  - draft
                  - published
                  - archived
                post[cover_image]:
                  type: string
                  format: binary
                  description: PNG, JPEG, GIF or WebP, up to 5 MB
                post[category_ids][]:
                  type: array
                  items:
                    type: integer
        required: true
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
