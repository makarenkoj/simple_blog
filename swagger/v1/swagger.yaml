---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/categories":
    get:
      summary: Get a list of categories
      tags:
      - Categories
      security:
      - bearerAuth: []
      responses:
        '200':
          description: successfully returns a list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                  required:
                  - id
                  - name
        '401':
          description: Unauthorized access
  "/api/v1/posts":
    post:
      summary: Create a new article
      tags:
      - Posts
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: The article was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  post:
                    type: object
        '422':
          description: Validation error (invalid data)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
        '401':
          description: Unauthorized access
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
        required: true
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
